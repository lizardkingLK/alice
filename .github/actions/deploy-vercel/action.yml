name: Deploy Vercel App
description: >-
  Build @repo/types, prevalidate Vercel secrets/link, install the Vercel CLI,
  then pull / build / deploy a production prebuilt project. Requires checkout +
  setup-workspace first. Expects VERCEL_TOKEN and VERCEL_ORG_ID in the job
  environment. Project Root Directory is configured in Vercel (e.g. apps/api,
  apps/web).

inputs:
  vercel-project-id:
    description: Vercel project id (VERCEL_PROJECT_ID_API or VERCEL_PROJECT_ID_WEB).
    required: true
  environment:
    description: Vercel environment for `vercel pull` (usually production).
    required: false
    default: production

runs:
  using: composite
  steps:
    - name: Build shared types package
      shell: bash
      run: pnpm turbo build --filter=@repo/types

    - name: Prevalidate Vercel deploy
      uses: ./.github/actions/vercel-prevalidate
      with:
        vercel-project-id: ${{ inputs.vercel-project-id }}

    - name: Install Global Vercel CLI Execution Agent
      shell: bash
      run: pnpm install --global vercel@latest --ignore-scripts

    - name: Pull Vercel Environment Variables
      shell: bash
      run: |
        set -euo pipefail
        if ! vercel pull --yes --environment=${{ inputs.environment }} --token="$VERCEL_TOKEN"; then
          echo "::error::vercel pull failed. Usual causes: expired VERCEL_TOKEN, project-scoped token (use team-scoped or account-scoped), wrong VERCEL_ORG_ID, or wrong project id. Re-run with debug locally: VERCEL_ORG_ID=… VERCEL_PROJECT_ID=… vercel pull --yes --environment=production --token=… --debug"
          exit 1
        fi
      env:
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Build Local App Context via Vercel CLI
      shell: bash
      run: vercel build --prod --token=$VERCEL_TOKEN
      env:
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Execute Controlled Production Deployment
      shell: bash
      run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
      env:
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
